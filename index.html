<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Q&A and Ads Website | موقع الأسئلة والإعلانات</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      margin: 0;
      padding: 0;
      background: #f9f9f9;
      color: #333;
    }
    header {
      background: #0e76a8;
      color: white;
      padding: 1rem;
      text-align: center;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 20px;
      background: #0b5e8e;
      padding: 0.5rem;
    }
    nav a {
      color: white;
      text-decoration: none;
    }
    .container {
      padding: 2rem;
      max-width: 1200px;
      margin: auto;
    }
    .section {
      margin-bottom: 2rem;
      background: white;
      border-radius: 10px;
      padding: 1.5rem;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }
    textarea, input {
      width: 100%;
      padding: 0.8rem;
      margin: 0.5rem 0;
      border-radius: 5px;
      border: 1px solid #ccc;
    }
    button {
      padding: 0.8rem 1.2rem;
      background: #0e76a8;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    .ads {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 1rem;
    }
    .ad-item {
      background: #f0f0f0;
      padding: 1rem;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <header>
    <h1>Q&A and Ads Website | موقع الأسئلة والإعلانات</h1>
  </header>
  <nav>
    <a href="#qa">Q&A | الأسئلة</a>
    <a href="#ads">Ads | الإعلانات</a>
    <a href="#contact">Contact | تواصل معنا</a>
  </nav>

  <div class="container">
    <section id="qa" class="section">
      <h2>Ask a Question | اطرح سؤالاً</h2>
      <input type="text" placeholder="Your name | اسمك">
      <textarea placeholder="Your question | سؤالك"></textarea>
      <button>Submit | إرسال</button>
    </section>

    <section id="ads" class="section">
      <h2>Advertisements | إعلانات</h2>
      <div class="ads">
        <div class="ad-item">Ad 1 | إعلان 1</div>
        <div class="ad-item">Ad 2 | إعلان 2</div>
        <div class="ad-item">Ad 3 | إعلان 3</div>
      </div>
    </section>

    <section id="contact" class="section">
      <h2>Contact Us | تواصل معنا</h2>
      <p>Email: info@example.com</p>
      <p>Phone: +123456789</p>
    </section>
  </div>
</body>
</html>
